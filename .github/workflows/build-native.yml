name: Build one-click Windows and macOS apps
on:
  workflow_dispatch:
  push:
    tags:
      - 'final-*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable with Pillow and verified FFmpeg
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Verify executable on Windows
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Resolve-Path './dist/FileTidy.exe').Path -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Bundled self-test failed: $($proc.ExitCode)" }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FileTidy_Windows_EXE
          path: dist/FileTidy.exe
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: AppleSilicon
          - os: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: brew install ffmpeg
      - name: Build macOS .app
        run: ./packaging/build_macos.sh
      - name: Verify app on macOS
        run: dist/FileTidy.app/Contents/MacOS/FileTidy --self-test
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: FileTidy_macOS_${{ matrix.arch }}_APP
          path: release/FileTidy_macOS.zip
          if-no-files-found: error
