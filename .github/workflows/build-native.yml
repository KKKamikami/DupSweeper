name: Build DupSweeper 1.3.0 desktop releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test core logic on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk ffmpeg xvfb
          python -m pip install pytest Pillow Send2Trash
      - name: Run unit tests
        run: python -m pytest -q tests
      - name: Test Chinese and English layouts
        run: xvfb-run -a python tests/gui_new_layout_smoke.py

  windows:
    name: Build Windows EXE in zh-TW and en
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package Chinese and English Windows executables
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Verify both self-contained binaries
        shell: pwsh
        run: |
          foreach ($file in @('DupSweeper_zh-TW.exe','DupSweeper_en.exe')) {
            $exe = (Resolve-Path "./dist/$file").Path
            $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "$file self-test failed: $($proc.ExitCode)" }
          }
      - name: Sign both executables (only if certificate secrets exist)
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: ./packaging/sign_windows.ps1
      - name: Report Windows signing status
        shell: pwsh
        run: |
          foreach ($file in @('DupSweeper_zh-TW.exe','DupSweeper_en.exe')) {
            $status = Get-AuthenticodeSignature "./dist/$file"
            "- ${file}: $($status.Status)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if ($status.Status -ne 'Valid') {
              Write-Warning "$file is not signed with a trusted publisher certificate. SmartScreen may warn users."
            }
          }
      - uses: actions/upload-artifact@v6
        with:
          name: native-windows
          path: |
            dist/DupSweeper_zh-TW.exe
            dist/DupSweeper_en.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS ${{ matrix.arch }} APP
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: AppleSilicon
            upload: native-mac-arm
          - runner: macos-15-intel
            arch: Intel
            upload: native-mac-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build APP with embedded FFmpeg
        run: bash packaging/build_macos.sh
      - name: Verify macOS app
        run: dist/DupSweeper.app/Contents/MacOS/DupSweeper --self-test
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.upload }}
          path: release/DupSweeper_macOS.zip
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    name: Build and test Ubuntu DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Package Debian app
        run: bash packaging/build_ubuntu.sh
      - name: Install and test on Ubuntu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./release/DupSweeper_Ubuntu_all_v1.3.0.deb
          /usr/bin/dupsweeper --self-test
      - uses: actions/upload-artifact@v6
        with:
          name: native-ubuntu
          path: release/DupSweeper_Ubuntu_all_v1.3.0.deb
          if-no-files-found: error
          retention-days: 14

  release-assets:
    name: Assemble 4 downloadable release files
    needs: [unit-tests, windows, macos, ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: native-windows
          path: downloads/windows
      - uses: actions/download-artifact@v7
        with:
          name: native-mac-arm
          path: downloads/mac_arm
      - uses: actions/download-artifact@v7
        with:
          name: native-mac-intel
          path: downloads/mac_intel
      - uses: actions/download-artifact@v7
        with:
          name: native-ubuntu
          path: downloads/ubuntu
      - name: Assemble four Release assets
        run: python3 packaging/assemble_release.py --inputs downloads --output release-assets
      - uses: actions/upload-artifact@v6
        with:
          name: DupSweeper_Release_v1.3.0
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
